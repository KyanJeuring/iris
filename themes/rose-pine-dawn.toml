name = "Rosé Pine Dawn"

[palette]
bg0 = "#FAF4ED"
bg1 = "#F2E9E1"
bg2 = "#E8DDD5"
bg3 = "#DFD4CD"
fg0 = "#575279"
fg1 = "#797593"
muted = "#9893A5"
blue = "#286983"
cyan = "#56949F"
green = "#56949F"
yellow = "#EA9D34"
red = "#B4637A"
purple = "#907AA9"
orange = "#D7827E"

[document]
foreground = "fg0"
background = "bg0"

[heading.h1]
foreground = "blue"
bold = true
separator = "double"

[heading.h2]
foreground = "cyan"
bold = true
separator = "single"

[heading.h3]
foreground = "purple"
bold = true

[heading.h4]
foreground = "green"
bold = true

[heading.h5]
foreground = "orange"
bold = true

[heading.h6]
foreground = "yellow"
italic = true

[text.strong]
foreground = "fg0"
bold = true

[text.emphasis]
foreground = "fg1"
italic = true

[text.strikethrough]
foreground = "muted"
strikethrough = true

[inline_code]
foreground = "cyan"
background = "bg2"

[link]
foreground = "blue"
underline = true

[list]
foreground = "fg0"
marker_foreground = "blue"
bullet = "•"
indent = 2

[quote]
foreground = "fg1"
border_foreground = "muted"

[code]
foreground = "fg0"
background = "bg1"
border_foreground = "muted"
syntax_theme = "InspiredGitHub"

[table]
foreground = "fg0"
border_foreground = "muted"
header_foreground = "blue"
header_bold = true

[horizontal_rule]
foreground = "muted"

[task.checked]
foreground = "green"

[task.unchecked]
foreground = "muted"

[image]
foreground = "purple"
italic = true
max_height = 14

[html.mark]
foreground = "bg0"
background = "yellow"

[html.kbd]
foreground = "cyan"
background = "bg2"
bold = true

[html.underline]
foreground = "fg0"
underline = true

[html.subtle]
foreground = "muted"
italic = true

[symbols.nerd_font]
task_checked = "󰄲"
task_unchecked = "󰄱"
alert_note = "󰋽"
alert_tip = "󰌶"
alert_important = "󰅾"
alert_warning = "󰀪"
alert_caution = "󰅚"
image = "󰋩"

[symbols.unicode]
task_checked = "☑"
task_unchecked = "☐"
alert_note = "ℹ"
alert_tip = "◆"
alert_important = "●"
alert_warning = "⚠"
alert_caution = "✖"
image = "▣"

[alert.note]
foreground = "blue"
bold = true

[alert.tip]
foreground = "green"
bold = true

[alert.important]
foreground = "purple"
bold = true

[alert.warning]
foreground = "yellow"
bold = true

[alert.caution]
foreground = "red"
bold = true

[search.match]
foreground = "fg0"
background = "bg3"

[search.current]
foreground = "bg0"
background = "blue"
bold = true

[search.prompt]
foreground = "blue"
bold = true

[ui.border]
foreground = "blue"
bold = true

[ui.status]
foreground = "muted"
background = "bg0"

[ui.status_accent]
foreground = "blue"
bold = true

[ui.help]
foreground = "fg0"
background = "bg1"

[ui.help_border]
foreground = "blue"

[ui.help_heading]
foreground = "blue"
bold = true

[ui.help_key]
foreground = "cyan"
bold = true
