name = "Dracula"

[palette]
bg0 = "#282A36"
bg1 = "#30323F"
bg2 = "#3A3C4A"
bg3 = "#44475A"
fg0 = "#F8F8F2"
fg1 = "#E6E6E0"
muted = "#6272A4"
cyan = "#8BE9FD"
green = "#50FA7B"
orange = "#FFB86C"
pink = "#FF79C6"
purple = "#BD93F9"
red = "#FF5555"
yellow = "#F1FA8C"

[document]
foreground = "fg0"
background = "bg0"

[heading.h1]
foreground = "purple"
bold = true
separator = "double"

[heading.h2]
foreground = "pink"
bold = true
separator = "single"

[heading.h3]
foreground = "cyan"
bold = true

[heading.h4]
foreground = "green"
bold = true

[heading.h5]
foreground = "orange"
bold = true

[heading.h6]
foreground = "yellow"
italic = true

[text.strong]
foreground = "fg0"
bold = true

[text.emphasis]
foreground = "fg1"
italic = true

[text.strikethrough]
foreground = "muted"
strikethrough = true

[inline_code]
foreground = "cyan"
background = "bg2"

[link]
foreground = "cyan"
underline = true

[list]
foreground = "fg0"
marker_foreground = "purple"
bullet = "•"
indent = 2

[quote]
foreground = "fg1"
border_foreground = "muted"

[code]
foreground = "fg0"
background = "bg1"
border_foreground = "muted"
syntax_theme = "base16-mocha.dark"

[table]
foreground = "fg0"
border_foreground = "muted"
header_foreground = "purple"
header_bold = true

[horizontal_rule]
foreground = "muted"

[task.checked]
foreground = "green"

[task.unchecked]
foreground = "muted"

[image]
foreground = "pink"
italic = true
max_height = 14

[html.mark]
foreground = "bg0"
background = "yellow"

[html.kbd]
foreground = "cyan"
background = "bg2"
bold = true

[html.underline]
foreground = "fg0"
underline = true

[html.subtle]
foreground = "muted"
italic = true

[symbols.nerd_font]
task_checked = "󰄲"
task_unchecked = "󰄱"
alert_note = "󰋽"
alert_tip = "󰌶"
alert_important = "󰅾"
alert_warning = "󰀪"
alert_caution = "󰅚"
image = "󰋩"

[symbols.unicode]
task_checked = "☑"
task_unchecked = "☐"
alert_note = "ℹ"
alert_tip = "◆"
alert_important = "●"
alert_warning = "⚠"
alert_caution = "✖"
image = "▣"

[alert.note]
foreground = "cyan"
bold = true

[alert.tip]
foreground = "green"
bold = true

[alert.important]
foreground = "purple"
bold = true

[alert.warning]
foreground = "yellow"
bold = true

[alert.caution]
foreground = "red"
bold = true

[search.match]
foreground = "fg0"
background = "bg3"

[search.current]
foreground = "bg0"
background = "purple"
bold = true

[search.prompt]
foreground = "pink"
bold = true

[ui.border]
foreground = "purple"
bold = true

[ui.status]
foreground = "muted"
background = "bg0"

[ui.status_accent]
foreground = "purple"
bold = true

[ui.help]
foreground = "fg0"
background = "bg1"

[ui.help_border]
foreground = "purple"

[ui.help_heading]
foreground = "pink"
bold = true

[ui.help_key]
foreground = "cyan"
bold = true
