name = "Catppuccin Mocha"

[palette]
bg0 = "#1E1E2E"
bg1 = "#181825"
bg2 = "#313244"
bg3 = "#45475A"
fg0 = "#CDD6F4"
fg1 = "#BAC2DE"
muted = "#7F849C"
red = "#F38BA8"
peach = "#FAB387"
yellow = "#F9E2AF"
green = "#A6E3A1"
teal = "#94E2D5"
blue = "#89B4FA"
mauve = "#CBA6F7"
pink = "#F5C2E7"

[document]
foreground = "fg0"
background = "bg0"

[heading.h1]
foreground = "mauve"
bold = true
separator = "double"

[heading.h2]
foreground = "blue"
bold = true
separator = "single"

[heading.h3]
foreground = "teal"
bold = true

[heading.h4]
foreground = "green"
bold = true

[heading.h5]
foreground = "pink"
bold = true

[heading.h6]
foreground = "yellow"
italic = true

[text.strong]
foreground = "fg0"
bold = true

[text.emphasis]
foreground = "fg1"
italic = true

[text.strikethrough]
foreground = "muted"
strikethrough = true

[inline_code]
foreground = "peach"
background = "bg2"

[link]
foreground = "blue"
underline = true

[list]
foreground = "fg0"
marker_foreground = "mauve"
bullet = "•"
indent = 2

[quote]
foreground = "fg1"
border_foreground = "muted"

[code]
foreground = "fg0"
background = "bg1"
border_foreground = "muted"
syntax_theme = "base16-mocha.dark"

[table]
foreground = "fg0"
border_foreground = "muted"
header_foreground = "mauve"
header_bold = true

[horizontal_rule]
foreground = "muted"

[task.checked]
foreground = "green"

[task.unchecked]
foreground = "muted"

[image]
foreground = "pink"
italic = true
max_height = 14

[html.mark]
foreground = "bg0"
background = "yellow"

[html.kbd]
foreground = "peach"
background = "bg2"
bold = true

[html.underline]
foreground = "fg0"
underline = true

[html.subtle]
foreground = "muted"
italic = true

[symbols.nerd_font]
task_checked = "󰄲"
task_unchecked = "󰄱"
alert_note = "󰋽"
alert_tip = "󰌶"
alert_important = "󰅾"
alert_warning = "󰀪"
alert_caution = "󰅚"
image = "󰋩"

[symbols.unicode]
task_checked = "☑"
task_unchecked = "☐"
alert_note = "ℹ"
alert_tip = "◆"
alert_important = "●"
alert_warning = "⚠"
alert_caution = "✖"
image = "▣"

[alert.note]
foreground = "blue"
bold = true

[alert.tip]
foreground = "green"
bold = true

[alert.important]
foreground = "mauve"
bold = true

[alert.warning]
foreground = "yellow"
bold = true

[alert.caution]
foreground = "red"
bold = true

[search.match]
foreground = "fg0"
background = "bg3"

[search.current]
foreground = "bg0"
background = "mauve"
bold = true

[search.prompt]
foreground = "blue"
bold = true

[ui.border]
foreground = "mauve"
bold = true

[ui.status]
foreground = "muted"
background = "bg0"

[ui.status_accent]
foreground = "mauve"
bold = true

[ui.help]
foreground = "fg0"
background = "bg1"

[ui.help_border]
foreground = "mauve"

[ui.help_heading]
foreground = "mauve"
bold = true

[ui.help_key]
foreground = "teal"
bold = true
