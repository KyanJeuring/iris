name = "Matrix"

[palette]
bg0 = "#020802"
bg1 = "#061006"
bg2 = "#0A190A"
bg3 = "#102610"
fg0 = "#9CFF9C"
fg1 = "#72E872"
muted = "#3D8A3D"
green = "#39FF14"
bright = "#B7FF8A"
yellow = "#DFFF00"
red = "#FF6B6B"
cyan = "#70FFD6"

[document]
foreground = "fg0"
background = "bg0"

[heading.h1]
foreground = "bright"
bold = true
separator = "double"

[heading.h2]
foreground = "green"
bold = true
separator = "single"

[heading.h3]
foreground = "cyan"
bold = true

[heading.h4]
foreground = "fg1"
bold = true

[heading.h5]
foreground = "green"

[heading.h6]
foreground = "muted"
italic = true

[text.strong]
foreground = "bright"
bold = true

[text.emphasis]
foreground = "fg1"
italic = true

[text.strikethrough]
foreground = "muted"
strikethrough = true

[inline_code]
foreground = "bright"
background = "bg2"

[link]
foreground = "cyan"
underline = true

[list]
foreground = "fg0"
marker_foreground = "green"
bullet = "•"
indent = 2

[quote]
foreground = "fg1"
border_foreground = "muted"

[code]
foreground = "fg0"
background = "bg1"
border_foreground = "green"
syntax_theme = "base16-ocean.dark"

[table]
foreground = "fg0"
border_foreground = "muted"
header_foreground = "green"
header_bold = true

[horizontal_rule]
foreground = "muted"

[task.checked]
foreground = "green"

[task.unchecked]
foreground = "muted"

[image]
foreground = "cyan"
italic = true
max_height = 14

[html.mark]
foreground = "bg0"
background = "yellow"

[html.kbd]
foreground = "bright"
background = "bg2"
bold = true

[html.underline]
foreground = "fg0"
underline = true

[html.subtle]
foreground = "muted"
italic = true

[symbols.nerd_font]
task_checked = "󰄲"
task_unchecked = "󰄱"
alert_note = "󰋽"
alert_tip = "󰌶"
alert_important = "󰅾"
alert_warning = "󰀪"
alert_caution = "󰅚"
image = "󰋩"

[symbols.unicode]
task_checked = "☑"
task_unchecked = "☐"
alert_note = "ℹ"
alert_tip = "◆"
alert_important = "●"
alert_warning = "⚠"
alert_caution = "✖"
image = "▣"

[alert.note]
foreground = "cyan"
bold = true

[alert.tip]
foreground = "green"
bold = true

[alert.important]
foreground = "bright"
bold = true

[alert.warning]
foreground = "yellow"
bold = true

[alert.caution]
foreground = "red"
bold = true

[search.match]
foreground = "fg0"
background = "bg3"

[search.current]
foreground = "bg0"
background = "yellow"
bold = true

[search.prompt]
foreground = "green"
bold = true

[ui.border]
foreground = "green"
bold = true

[ui.status]
foreground = "muted"
background = "bg0"

[ui.status_accent]
foreground = "green"
bold = true

[ui.help]
foreground = "fg0"
background = "bg1"

[ui.help_border]
foreground = "green"

[ui.help_heading]
foreground = "bright"
bold = true

[ui.help_key]
foreground = "cyan"
bold = true
