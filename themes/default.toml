# IRIS built-in default theme.
#
# This theme follows the user's terminal colors for the main UI while using
# standard ANSI colors for document accents and semantic information.

name = "Default"

[palette]
bg0 = "default"
bg1 = "default"
bg2 = "default"
bg3 = "default"
fg0 = "default"
fg1 = "default"
muted = "darkgray"
red = "red"
green = "green"
yellow = "yellow"
blue = "blue"
purple = "magenta"
cyan = "cyan"

[document]
foreground = "fg0"
background = "bg0"

[heading.h1]
foreground = "blue"
bold = true
separator = "double"

[heading.h2]
foreground = "cyan"
bold = true
separator = "single"

[heading.h3]
foreground = "purple"
bold = true

[heading.h4]
foreground = "green"
bold = true

[heading.h5]
foreground = "yellow"
bold = true

[heading.h6]
foreground = "fg0"
italic = true

[text.strong]
foreground = "fg0"
bold = true

[text.emphasis]
foreground = "fg0"
italic = true

[text.strikethrough]
foreground = "muted"
strikethrough = true

[inline_code]
foreground = "cyan"
background = "bg0"

[link]
foreground = "blue"
underline = true

[list]
foreground = "fg0"
marker_foreground = "cyan"
bullet = "•"
indent = 2

[quote]
foreground = "fg0"
border_foreground = "muted"

[code]
foreground = "fg0"
background = "bg0"
border_foreground = "muted"
syntax_theme = "base16-ocean.dark"

[table]
foreground = "fg0"
border_foreground = "muted"
header_foreground = "blue"
header_bold = true

[horizontal_rule]
foreground = "muted"

[task.checked]
foreground = "green"

[task.unchecked]
foreground = "muted"

[image]
foreground = "purple"
italic = true
max_height = 14

[html.mark]
foreground = "black"
background = "yellow"

[html.kbd]
foreground = "cyan"
background = "bg0"
bold = true

[html.underline]
foreground = "fg0"
underline = true

[html.subtle]
foreground = "muted"
italic = true

[symbols.nerd_font]
task_checked = "󰄲"
task_unchecked = "󰄱"
alert_note = "󰋽"
alert_tip = "󰌶"
alert_important = "󰅾"
alert_warning = "󰀪"
alert_caution = "󰅚"
image = "󰋩"

[symbols.unicode]
task_checked = "☑"
task_unchecked = "☐"
alert_note = "ℹ"
alert_tip = "◆"
alert_important = "●"
alert_warning = "⚠"
alert_caution = "✖"
image = "▣"

[alert.note]
foreground = "blue"
bold = true

[alert.tip]
foreground = "green"
bold = true

[alert.important]
foreground = "purple"
bold = true

[alert.warning]
foreground = "yellow"
bold = true

[alert.caution]
foreground = "red"
bold = true

[search.match]
foreground = "fg0"
underline = true

[search.current]
foreground = "black"
background = "yellow"
bold = true

[search.prompt]
foreground = "cyan"
bold = true

[ui.border]
foreground = "fg0"

[ui.status]
foreground = "fg0"
background = "bg0"

[ui.status_accent]
foreground = "cyan"
bold = true

[ui.help]
foreground = "fg0"
background = "bg0"

[ui.help_border]
foreground = "fg0"

[ui.help_heading]
foreground = "blue"
bold = true

[ui.help_key]
foreground = "cyan"
bold = true
