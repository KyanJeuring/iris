name = "Gruvbox"

[palette]
bg0 = "#282828"
bg1 = "#3C3836"
bg2 = "#504945"
bg3 = "#665C54"
fg0 = "#EBDBB2"
fg1 = "#D5C4A1"
muted = "#928374"
red = "#FB4934"
green = "#B8BB26"
yellow = "#FABD2F"
blue = "#83A598"
purple = "#D3869B"
aqua = "#8EC07C"
orange = "#FE8019"

[document]
foreground = "fg0"
background = "bg0"

[heading.h1]
foreground = "orange"
bold = true
separator = "double"

[heading.h2]
foreground = "yellow"
bold = true
separator = "single"

[heading.h3]
foreground = "blue"
bold = true

[heading.h4]
foreground = "purple"
bold = true

[heading.h5]
foreground = "aqua"
bold = true

[heading.h6]
foreground = "green"
italic = true

[text.strong]
foreground = "fg0"
bold = true

[text.emphasis]
foreground = "fg1"
italic = true

[text.strikethrough]
foreground = "muted"
strikethrough = true

[inline_code]
foreground = "orange"
background = "bg2"

[link]
foreground = "blue"
underline = true

[list]
foreground = "fg0"
marker_foreground = "yellow"
bullet = "•"
indent = 2

[quote]
foreground = "fg1"
border_foreground = "muted"

[code]
foreground = "fg0"
background = "bg1"
border_foreground = "muted"
syntax_theme = "base16-eighties.dark"

[table]
foreground = "fg0"
border_foreground = "muted"
header_foreground = "yellow"
header_bold = true

[horizontal_rule]
foreground = "muted"

[task.checked]
foreground = "green"

[task.unchecked]
foreground = "muted"

[image]
foreground = "purple"
italic = true
max_height = 14

[html.mark]
foreground = "bg0"
background = "yellow"

[html.kbd]
foreground = "orange"
background = "bg2"
bold = true

[html.underline]
foreground = "fg0"
underline = true

[html.subtle]
foreground = "muted"
italic = true

[symbols.nerd_font]
task_checked = "󰄲"
task_unchecked = "󰄱"
alert_note = "󰋽"
alert_tip = "󰌶"
alert_important = "󰅾"
alert_warning = "󰀪"
alert_caution = "󰅚"
image = "󰋩"

[symbols.unicode]
task_checked = "☑"
task_unchecked = "☐"
alert_note = "ℹ"
alert_tip = "◆"
alert_important = "●"
alert_warning = "⚠"
alert_caution = "✖"
image = "▣"

[alert.note]
foreground = "blue"
bold = true

[alert.tip]
foreground = "green"
bold = true

[alert.important]
foreground = "purple"
bold = true

[alert.warning]
foreground = "yellow"
bold = true

[alert.caution]
foreground = "red"
bold = true

[search.match]
foreground = "fg0"
background = "bg3"

[search.current]
foreground = "bg0"
background = "yellow"
bold = true

[search.prompt]
foreground = "orange"
bold = true

[ui.border]
foreground = "yellow"
bold = true

[ui.status]
foreground = "muted"
background = "bg0"

[ui.status_accent]
foreground = "yellow"
bold = true

[ui.help]
foreground = "fg0"
background = "bg1"

[ui.help_border]
foreground = "yellow"

[ui.help_heading]
foreground = "orange"
bold = true

[ui.help_key]
foreground = "aqua"
bold = true
