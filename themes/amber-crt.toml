name = "Amber CRT"

[palette]
bg0 = "#0B0802"
bg1 = "#151005"
bg2 = "#211807"
bg3 = "#30220A"
fg0 = "#FFD88A"
fg1 = "#E9B95F"
muted = "#9A6E2D"
amber = "#FFB000"
bright = "#FFD36A"
yellow = "#FFE58A"
red = "#FF7657"
green = "#B7D76A"
cyan = "#E7C47A"

[document]
foreground = "fg0"
background = "bg0"

[heading.h1]
foreground = "bright"
bold = true
separator = "double"

[heading.h2]
foreground = "amber"
bold = true
separator = "single"

[heading.h3]
foreground = "yellow"
bold = true

[heading.h4]
foreground = "fg1"
bold = true

[heading.h5]
foreground = "amber"

[heading.h6]
foreground = "muted"
italic = true

[text.strong]
foreground = "bright"
bold = true

[text.emphasis]
foreground = "fg1"
italic = true

[text.strikethrough]
foreground = "muted"
strikethrough = true

[inline_code]
foreground = "bright"
background = "bg2"

[link]
foreground = "yellow"
underline = true

[list]
foreground = "fg0"
marker_foreground = "amber"
bullet = "•"
indent = 2

[quote]
foreground = "fg1"
border_foreground = "muted"

[code]
foreground = "fg0"
background = "bg1"
border_foreground = "amber"
syntax_theme = "Solarized (dark)"

[table]
foreground = "fg0"
border_foreground = "muted"
header_foreground = "amber"
header_bold = true

[horizontal_rule]
foreground = "muted"

[task.checked]
foreground = "green"

[task.unchecked]
foreground = "muted"

[image]
foreground = "yellow"
italic = true
max_height = 14

[html.mark]
foreground = "bg0"
background = "yellow"

[html.kbd]
foreground = "bright"
background = "bg2"
bold = true

[html.underline]
foreground = "fg0"
underline = true

[html.subtle]
foreground = "muted"
italic = true

[symbols.nerd_font]
task_checked = "󰄲"
task_unchecked = "󰄱"
alert_note = "󰋽"
alert_tip = "󰌶"
alert_important = "󰅾"
alert_warning = "󰀪"
alert_caution = "󰅚"
image = "󰋩"

[symbols.unicode]
task_checked = "☑"
task_unchecked = "☐"
alert_note = "ℹ"
alert_tip = "◆"
alert_important = "●"
alert_warning = "⚠"
alert_caution = "✖"
image = "▣"

[alert.note]
foreground = "fg1"
bold = true

[alert.tip]
foreground = "green"
bold = true

[alert.important]
foreground = "bright"
bold = true

[alert.warning]
foreground = "yellow"
bold = true

[alert.caution]
foreground = "red"
bold = true

[search.match]
foreground = "fg0"
background = "bg3"

[search.current]
foreground = "bg0"
background = "amber"
bold = true

[search.prompt]
foreground = "amber"
bold = true

[ui.border]
foreground = "amber"
bold = true

[ui.status]
foreground = "muted"
background = "bg0"

[ui.status_accent]
foreground = "amber"
bold = true

[ui.help]
foreground = "fg0"
background = "bg1"

[ui.help_border]
foreground = "amber"

[ui.help_heading]
foreground = "bright"
bold = true

[ui.help_key]
foreground = "yellow"
bold = true
