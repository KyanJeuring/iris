name = "Vaporwave"

[palette]
bg0 = "#160D24"
bg1 = "#211231"
bg2 = "#301841"
bg3 = "#47205A"
fg0 = "#F4E8FF"
fg1 = "#D6BEE8"
muted = "#8D6FA4"
pink = "#FF71CE"
cyan = "#01CDFE"
purple = "#B967FF"
blue = "#6A8DFF"
yellow = "#FFF275"
green = "#72F1B8"
red = "#FF5F87"

[document]
foreground = "fg0"
background = "bg0"

[heading.h1]
foreground = "pink"
bold = true
separator = "double"

[heading.h2]
foreground = "cyan"
bold = true
separator = "single"

[heading.h3]
foreground = "purple"
bold = true

[heading.h4]
foreground = "blue"
bold = true

[heading.h5]
foreground = "pink"

[heading.h6]
foreground = "yellow"
italic = true

[text.strong]
foreground = "fg0"
bold = true

[text.emphasis]
foreground = "fg1"
italic = true

[text.strikethrough]
foreground = "muted"
strikethrough = true

[inline_code]
foreground = "cyan"
background = "bg2"

[link]
foreground = "cyan"
underline = true

[list]
foreground = "fg0"
marker_foreground = "pink"
bullet = "•"
indent = 2

[quote]
foreground = "fg1"
border_foreground = "purple"

[code]
foreground = "fg0"
background = "bg1"
border_foreground = "purple"
syntax_theme = "base16-mocha.dark"

[table]
foreground = "fg0"
border_foreground = "purple"
header_foreground = "cyan"
header_bold = true

[horizontal_rule]
foreground = "purple"

[task.checked]
foreground = "green"

[task.unchecked]
foreground = "muted"

[image]
foreground = "pink"
italic = true
max_height = 14

[html.mark]
foreground = "bg0"
background = "yellow"

[html.kbd]
foreground = "pink"
background = "bg2"
bold = true

[html.underline]
foreground = "fg0"
underline = true

[html.subtle]
foreground = "muted"
italic = true

[symbols.nerd_font]
task_checked = "󰄲"
task_unchecked = "󰄱"
alert_note = "󰋽"
alert_tip = "󰌶"
alert_important = "󰅾"
alert_warning = "󰀪"
alert_caution = "󰅚"
image = "󰋩"

[symbols.unicode]
task_checked = "☑"
task_unchecked = "☐"
alert_note = "ℹ"
alert_tip = "◆"
alert_important = "●"
alert_warning = "⚠"
alert_caution = "✖"
image = "▣"

[alert.note]
foreground = "cyan"
bold = true

[alert.tip]
foreground = "green"
bold = true

[alert.important]
foreground = "purple"
bold = true

[alert.warning]
foreground = "yellow"
bold = true

[alert.caution]
foreground = "red"
bold = true

[search.match]
foreground = "fg0"
background = "bg3"

[search.current]
foreground = "bg0"
background = "pink"
bold = true

[search.prompt]
foreground = "cyan"
bold = true

[ui.border]
foreground = "pink"
bold = true

[ui.status]
foreground = "muted"
background = "bg0"

[ui.status_accent]
foreground = "pink"
bold = true

[ui.help]
foreground = "fg0"
background = "bg1"

[ui.help_border]
foreground = "pink"

[ui.help_heading]
foreground = "cyan"
bold = true

[ui.help_key]
foreground = "purple"
bold = true
