name = "Rosé Pine"

[palette]
bg0 = "#191724"
bg1 = "#1F1D2E"
bg2 = "#26233A"
bg3 = "#2A273F"
fg0 = "#E0DEF4"
fg1 = "#908CAA"
muted = "#6E6A86"
blue = "#31748F"
cyan = "#9CCFD8"
green = "#9CCFD8"
yellow = "#F6C177"
red = "#EB6F92"
purple = "#C4A7E7"
orange = "#EBBCBA"

[document]
foreground = "fg0"
background = "bg0"

[heading.h1]
foreground = "blue"
bold = true
separator = "double"

[heading.h2]
foreground = "cyan"
bold = true
separator = "single"

[heading.h3]
foreground = "purple"
bold = true

[heading.h4]
foreground = "green"
bold = true

[heading.h5]
foreground = "orange"
bold = true

[heading.h6]
foreground = "yellow"
italic = true

[text.strong]
foreground = "fg0"
bold = true

[text.emphasis]
foreground = "fg1"
italic = true

[text.strikethrough]
foreground = "muted"
strikethrough = true

[inline_code]
foreground = "cyan"
background = "bg2"

[link]
foreground = "blue"
underline = true

[list]
foreground = "fg0"
marker_foreground = "blue"
bullet = "•"
indent = 2

[quote]
foreground = "fg1"
border_foreground = "muted"

[code]
foreground = "fg0"
background = "bg1"
border_foreground = "muted"
syntax_theme = "base16-mocha.dark"

[table]
foreground = "fg0"
border_foreground = "muted"
header_foreground = "blue"
header_bold = true

[horizontal_rule]
foreground = "muted"

[task.checked]
foreground = "green"

[task.unchecked]
foreground = "muted"

[image]
foreground = "purple"
italic = true
max_height = 14

[html.mark]
foreground = "bg0"
background = "yellow"

[html.kbd]
foreground = "cyan"
background = "bg2"
bold = true

[html.underline]
foreground = "fg0"
underline = true

[html.subtle]
foreground = "muted"
italic = true

[symbols.nerd_font]
task_checked = "󰄲"
task_unchecked = "󰄱"
alert_note = "󰋽"
alert_tip = "󰌶"
alert_important = "󰅾"
alert_warning = "󰀪"
alert_caution = "󰅚"
image = "󰋩"

[symbols.unicode]
task_checked = "☑"
task_unchecked = "☐"
alert_note = "ℹ"
alert_tip = "◆"
alert_important = "●"
alert_warning = "⚠"
alert_caution = "✖"
image = "▣"

[alert.note]
foreground = "blue"
bold = true

[alert.tip]
foreground = "green"
bold = true

[alert.important]
foreground = "purple"
bold = true

[alert.warning]
foreground = "yellow"
bold = true

[alert.caution]
foreground = "red"
bold = true

[search.match]
foreground = "fg0"
background = "bg3"

[search.current]
foreground = "bg0"
background = "blue"
bold = true

[search.prompt]
foreground = "blue"
bold = true

[ui.border]
foreground = "blue"
bold = true

[ui.status]
foreground = "muted"
background = "bg0"

[ui.status_accent]
foreground = "blue"
bold = true

[ui.help]
foreground = "fg0"
background = "bg1"

[ui.help_border]
foreground = "blue"

[ui.help_heading]
foreground = "blue"
bold = true

[ui.help_key]
foreground = "cyan"
bold = true
