name = "Hot Dog Stand"

[palette]
bg0 = "#C40000"
bg1 = "#A30000"
bg2 = "#7F0000"
bg3 = "#FF2B00"
fg0 = "#FFF100"
fg1 = "#FFE45A"
muted = "#FFB82E"
yellow = "#FFF100"
red = "#FF0000"
darkred = "#670000"
black = "#080000"
white = "#FFF7D6"
green = "#64FF4A"
cyan = "#54E8FF"
purple = "#FF61FF"

[document]
foreground = "fg0"
background = "bg0"

[heading.h1]
foreground = "black"
background = "yellow"
bold = true
separator = "double"

[heading.h2]
foreground = "yellow"
bold = true
separator = "single"

[heading.h3]
foreground = "white"
bold = true

[heading.h4]
foreground = "cyan"
bold = true

[heading.h5]
foreground = "green"

[heading.h6]
foreground = "fg1"
italic = true

[text.strong]
foreground = "white"
bold = true

[text.emphasis]
foreground = "fg1"
italic = true

[text.strikethrough]
foreground = "muted"
strikethrough = true

[inline_code]
foreground = "yellow"
background = "darkred"

[link]
foreground = "cyan"
underline = true

[list]
foreground = "fg0"
marker_foreground = "white"
bullet = "•"
indent = 2

[quote]
foreground = "white"
border_foreground = "yellow"

[code]
foreground = "white"
background = "darkred"
border_foreground = "yellow"
syntax_theme = "base16-eighties.dark"

[table]
foreground = "fg0"
border_foreground = "yellow"
header_foreground = "white"
header_bold = true

[horizontal_rule]
foreground = "yellow"

[task.checked]
foreground = "green"

[task.unchecked]
foreground = "muted"

[image]
foreground = "purple"
italic = true
max_height = 14

[html.mark]
foreground = "black"
background = "yellow"

[html.kbd]
foreground = "yellow"
background = "darkred"
bold = true

[html.underline]
foreground = "white"
underline = true

[html.subtle]
foreground = "muted"
italic = true

[symbols.nerd_font]
task_checked = "󰄲"
task_unchecked = "󰄱"
alert_note = "󰋽"
alert_tip = "󰌶"
alert_important = "󰅾"
alert_warning = "󰀪"
alert_caution = "󰅚"
image = "󰋩"

[symbols.unicode]
task_checked = "☑"
task_unchecked = "☐"
alert_note = "ℹ"
alert_tip = "◆"
alert_important = "●"
alert_warning = "⚠"
alert_caution = "✖"
image = "▣"

[alert.note]
foreground = "cyan"
bold = true

[alert.tip]
foreground = "green"
bold = true

[alert.important]
foreground = "purple"
bold = true

[alert.warning]
foreground = "yellow"
bold = true

[alert.caution]
foreground = "white"
bold = true

[search.match]
foreground = "yellow"
background = "darkred"

[search.current]
foreground = "black"
background = "yellow"
bold = true

[search.prompt]
foreground = "white"
bold = true

[ui.border]
foreground = "yellow"
bold = true

[ui.status]
foreground = "fg1"
background = "bg0"

[ui.status_accent]
foreground = "yellow"
bold = true

[ui.help]
foreground = "yellow"
background = "darkred"

[ui.help_border]
foreground = "yellow"

[ui.help_heading]
foreground = "white"
bold = true

[ui.help_key]
foreground = "cyan"
bold = true
