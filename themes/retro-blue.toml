name = "Retro Blue"

[palette]
bg0 = "#071B3A"
bg1 = "#0B2448"
bg2 = "#10305B"
bg3 = "#183E70"
fg0 = "#D9E6F2"
fg1 = "#AFC5D8"
muted = "#6889A5"
blue = "#5FA8FF"
cyan = "#63E6FF"
white = "#F4F7FA"
yellow = "#FFD866"
green = "#7DE39A"
red = "#FF7A90"
purple = "#B4A0FF"

[document]
foreground = "fg0"
background = "bg0"

[heading.h1]
foreground = "white"
bold = true
separator = "double"

[heading.h2]
foreground = "cyan"
bold = true
separator = "single"

[heading.h3]
foreground = "blue"
bold = true

[heading.h4]
foreground = "purple"
bold = true

[heading.h5]
foreground = "cyan"

[heading.h6]
foreground = "fg1"
italic = true

[text.strong]
foreground = "white"
bold = true

[text.emphasis]
foreground = "fg1"
italic = true

[text.strikethrough]
foreground = "muted"
strikethrough = true

[inline_code]
foreground = "cyan"
background = "bg2"

[link]
foreground = "cyan"
underline = true

[list]
foreground = "fg0"
marker_foreground = "blue"
bullet = "•"
indent = 2

[quote]
foreground = "fg1"
border_foreground = "muted"

[code]
foreground = "fg0"
background = "bg1"
border_foreground = "blue"
syntax_theme = "base16-ocean.dark"

[table]
foreground = "fg0"
border_foreground = "muted"
header_foreground = "cyan"
header_bold = true

[horizontal_rule]
foreground = "muted"

[task.checked]
foreground = "green"

[task.unchecked]
foreground = "muted"

[image]
foreground = "purple"
italic = true
max_height = 14

[html.mark]
foreground = "bg0"
background = "yellow"

[html.kbd]
foreground = "white"
background = "bg2"
bold = true

[html.underline]
foreground = "fg0"
underline = true

[html.subtle]
foreground = "muted"
italic = true

[symbols.nerd_font]
task_checked = "󰄲"
task_unchecked = "󰄱"
alert_note = "󰋽"
alert_tip = "󰌶"
alert_important = "󰅾"
alert_warning = "󰀪"
alert_caution = "󰅚"
image = "󰋩"

[symbols.unicode]
task_checked = "☑"
task_unchecked = "☐"
alert_note = "ℹ"
alert_tip = "◆"
alert_important = "●"
alert_warning = "⚠"
alert_caution = "✖"
image = "▣"

[alert.note]
foreground = "cyan"
bold = true

[alert.tip]
foreground = "green"
bold = true

[alert.important]
foreground = "purple"
bold = true

[alert.warning]
foreground = "yellow"
bold = true

[alert.caution]
foreground = "red"
bold = true

[search.match]
foreground = "fg0"
background = "bg3"

[search.current]
foreground = "bg0"
background = "cyan"
bold = true

[search.prompt]
foreground = "cyan"
bold = true

[ui.border]
foreground = "cyan"
bold = true

[ui.status]
foreground = "muted"
background = "bg0"

[ui.status_accent]
foreground = "cyan"
bold = true

[ui.help]
foreground = "fg0"
background = "bg1"

[ui.help_border]
foreground = "blue"

[ui.help_heading]
foreground = "cyan"
bold = true

[ui.help_key]
foreground = "white"
bold = true
